name: Fuzz
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [source, pptx, slide]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ libclang-dev
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Seeds
        run: |
          cargo build -p slide-shuttle-cli --locked
          mkdir -p seeds/source seeds/pptx seeds/slide fuzz/corpus/${{ matrix.target }}
          cp examples/*.xml fuzz/seeds/*.xml seeds/source/
          target/debug/slide-shuttle export fuzz/seeds/latin.xml --out seeds/pptx/latin.pptx \
            --font crates/slide-shuttle-core/tests/fonts/DejaVuSans.ttf \
            --font crates/slide-shuttle-core/tests/fonts/DejaVuSans-Bold.ttf
          unzip -p seeds/pptx/latin.pptx ppt/slides/slide1.xml > seeds/slide/latin.xml
      - run: cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- -max_total_time=600 -rss_limit_mb=3072 -timeout=20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
