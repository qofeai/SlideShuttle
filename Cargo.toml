[workspace]
members = ["crates/slide-shuttle-core", "crates/slide-shuttle-cli", "crates/slide-shuttle-wasm"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
roxmltree = "0.21"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
tiny-skia = "0.12"
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
ttf-parser = "0.25"
svgtypes = "0.16"

[profile.release]
lto = "thin"
